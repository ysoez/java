<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Search</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="layout">
    <div class="header">
        <div class="header-label">Distributed Search</div>
        <h1>Find your <span>documents</span></h1>
    </div>

    <div class="search-card">
        <div class="input-group">
            <input type="text" id="search_text" placeholder="Enter your search query…">
            <i class="fas fa-search input-icon"></i>
        </div>
        <div class="input-row">
            <div class="input-group">
                <input type="text" id="num_results" placeholder="Max results">
                <i class="fas fa-list-ol input-icon"></i>
            </div>
            <div class="input-group">
                <input type="text" id="min_score" placeholder="Min score">
                <i class="fas fa-sliders-h input-icon"></i>
            </div>
        </div>
        <button id="submit_button">
            <i class="fas fa-search"></i>
            <span class="spinner"></span>
            Search
        </button>
    </div>

    <div id="no_results_error">
        <i class="fas fa-circle-exclamation"></i>
        No documents matched your query.
    </div>

    <div id="results">
        <div class="results-header">
            <span class="results-label">Results</span>
            <span class="results-count" id="results_count">0 found</span>
        </div>
        <table>
            <thead>
            <tr>
                <th>Document</th>
                <th style="text-align:right">Score</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.js"></script>
<script src="assets/javascript.js"></script>
</body>
</html>
